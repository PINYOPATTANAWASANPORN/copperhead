# Layout intent for esp32-amp (RFC 11 §7.3). Read automatically by `pcb place`
# and `pcb infer-intent` because it sits beside the board. Everything here is a
# requirement a person would state at review: where the connectors go, which
# capacitor belongs to which pin, and what has to stay together.
placement:
  fixed:
    - component: J1          # USB-C: plug goes in from the west edge
      edge: west
      orientation: outward
    - component: J2          # speaker terminal: wires leave from the east edge
      edge: east
      orientation: outward
    - component: J3          # UART header: reachable from the south edge
      edge: south
      orientation: outward

  attachments:
    # ESP32-S3 module: 3V3 is pad 2
    - component: C3          # 100n, the one that has to be at the pin
      target: { component: U1, pins: ["2"] }
      max_distance_mm: 2
      priority: critical
    - component: C4          # 22u bulk, may sit further out
      target: { component: U1, pins: ["2"] }
      max_distance_mm: 6
    - component: R4          # EN pullup
      target: { component: U1, pins: ["3"] }
      max_distance_mm: 6
    - component: C5          # EN delay cap
      target: { component: U1, pins: ["3"] }
      max_distance_mm: 6
    - component: SW2         # RESET drives EN
      target: { component: U1, pins: ["3"] }
      max_distance_mm: 12
    - component: SW1         # BOOT drives IO0 (pad 27)
      target: { component: U1, pins: ["27"] }
      max_distance_mm: 12

    # AP2112K-3.3: pad 1 is VIN, pad 5 is VOUT
    - component: C1
      target: { component: U2, pins: ["1"] }
      max_distance_mm: 3
      priority: critical
    - component: C2
      target: { component: U2, pins: ["5"] }
      max_distance_mm: 3
      priority: critical

    # MAX98357A: pads 7 and 8 are both VDD; the class-D supply loop is the
    # hottest thing on this board, so the bulk cap comes with it
    - component: C6
      target: { component: U3, pins: ["7"] }
      max_distance_mm: 1.5
      priority: critical
    - component: C7
      target: { component: U3, pins: ["8"] }
      max_distance_mm: 4
    - component: CP1
      target: { component: U3, pins: ["7"] }
      max_distance_mm: 12
    - component: R5          # GAIN_SLOT (pad 2) is a high-impedance select pin
      target: { component: U3, pins: ["2"] }
      max_distance_mm: 4
    - component: R6          # SD_MODE divider (pad 4) likewise
      target: { component: U3, pins: ["4"] }
      max_distance_mm: 5
    - component: R7
      target: { component: U3, pins: ["4"] }
      max_distance_mm: 5

    # USB-C front end stays at the receptacle
    - component: R1
      target: { component: J1, pins: ["A5"] }
      max_distance_mm: 6
    - component: R2
      target: { component: J1, pins: ["B5"] }
      max_distance_mm: 6
    - component: D1          # TVS clamps at the connector or not at all
      target: { component: J1, pins: ["A4"] }
      max_distance_mm: 8
      priority: critical
    - component: F1
      target: { component: J1, pins: ["A4"] }
      max_distance_mm: 10

  groups:
    - id: output-filter      # ferrites and their caps, tight, by the terminal
      components: [FB1, FB2, C8, C9, J2]
      max_spread_mm: 14
    - id: i2s-link           # three clock/data lines, kept short
      components: [U1, U3]
      max_spread_mm: 32
